# pc5-launcher-hook v1 – angelegt von install.sh, entfernt von uninstall.sh (nicht von Hand ändern)
#
# E104 d (Bauplan 2.3): Ergänzung zu Valves steam-launcher.service auf SteamOS 3, abgelegt als
# ~/.config/systemd/user/steam-launcher.service.d/50-pc5-launcher.conf. Nichts davon liegt in /usr; benennt
# Valve den Dienst um, wirkt diese Datei nicht mehr und es startet reines Steam.
#
# Start: eine Weiche. ~/.local/share/couch/hook/steamos-switch.sh (nur nach bash -n) startet den PC5 Launcher
# oder Valves Launcher. Fehlt sie oder ist sie kaputt, startet Valves Launcher wie ohne diese Datei.
# ("$$" ist systemds Schreibweise für ein "$", das bash sieht.)
#
# Ende: Valve schickt SIGTERM an das Kind des Hauptprozesses (das Startskript von Steam reicht Signale nicht
# weiter) und KillSignal=SIGCONT an den Hauptprozess. Läuft unser Supervisor, bekämen so Home bzw. Steam
# SIGTERM, ohne dass er es merkt, und er startete das Home mitten im Herunterfahren neu. Deshalb: Ist der
# Hauptprozess der Supervisor, bekommt er selbst SIGTERM und beendet Home und Steam in Ruhe (on_term). Ist es
# Valves Launcher (Notschalter, Sicherung, Weiche), gilt Valves eigene Regel unverändert. KillSignal bleibt
# Valves SIGCONT: Ein SIGTERM an das Startskript von Steam bräche Steam sonst hart ab (KillMode=mixed).
[Service]
Environment=COUCH_PLATFORM=steamos
ExecStart=
ExecStart=/usr/bin/bash -c 'h="$${HOME}/.local/share/couch/hook/steamos-switch.sh"; if [ -r "$$h" ] && bash -n "$$h" 2>/dev/null; then exec bash "$$h"; fi; [ -x /usr/lib/steamos/steam-launcher ] && exec /usr/lib/steamos/steam-launcher; exec steam -steamos3 -steampal -steamdeck -gamepadui'
ExecStop=
ExecStop=/usr/bin/bash -c 'm="$MAINPID"; [ -n "$$m" ] || exit 0; if grep -qaF /session/supervisor.py "/proc/$$m/cmdline" 2>/dev/null; then kill -TERM "$$m"; else kill -TERM $$(pgrep -P "$$m" || echo "$$m"); fi'
